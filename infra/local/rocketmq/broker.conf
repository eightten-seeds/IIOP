# IIOP local RocketMQ single-node broker configuration.
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
namesrvAddr=127.0.0.1:9876
brokerIP1=127.0.0.1
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
diskMaxUsedSpaceRatio=99
storePathRootDir=E:/IIOP-data/rocketmq/store
storePathCommitLog=E:/IIOP-data/rocketmq/commitlog
